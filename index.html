<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agri Intelligence</title>
<style>body{font-family:Arial;margin:0;background:#f3f6f2;color:#183020}header{background:#20562e;color:white;padding:25px}main{max-width:1000px;margin:auto;padding:20px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:white;padding:18px;border-radius:14px}.n{font-size:28px;font-weight:bold}@media(max-width:700px){.cards{grid-template-columns:1fr 1fr}}</style></head>
<body><header><h1>🌾 Agri Intelligence</h1><div>Satellite + Weather Dashboard</div></header><main>
<div class="cards"><div class="card">Temperature<div class="n" id="t">—</div></div><div class="card">Rainfall<div class="n" id="r">—</div></div><div class="card">Satellite scenes<div class="n" id="s">—</div></div><div class="card">NDVI<div class="n">0.68</div></div></div>
<div class="card" style="margin-top:15px"><h2>Recent Sentinel-2 scenes</h2><div id="rows">Loading…</div></div>
</main><script>
(async()=>{try{let[w,s]=await Promise.all([fetch('/api/weather').then(r=>r.json()),fetch('/api/satellite').then(r=>r.json())]);let p=w.properties.parameter,d=Object.keys(p.T2M),last=d.at(-1);document.getElementById('t').textContent=(p.T2M[last]||0).toFixed(1)+' °C';document.getElementById('r').textContent=Object.values(p.PRECTOTCORR).reduce((a,b)=>a+(+b||0),0).toFixed(1)+' mm';document.getElementById('s').textContent=s.length;document.getElementById('rows').innerHTML=s.map(x=>`<p>${(x.date||'').slice(0,10)} — cloud ${x.cloud==null?'—':x.cloud.toFixed(1)+'%'} — ${x.id}</p>`).join('')}catch(e){document.getElementById('rows').textContent='Data service temporarily unavailable.'}})()
</script></body></html>
