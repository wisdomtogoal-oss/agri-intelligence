<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agri Intelligence</title><style>body{margin:0;font:16px Arial;background:#f3f6f2;color:#183020}header{background:#20562e;color:white;padding:24px}main{max-width:1100px;margin:auto;padding:20px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.c{background:white;padding:18px;border-radius:14px}.n{font-size:28px;font-weight:bold}table{width:100%;background:white;padding:10px}td,th{padding:9px;text-align:left;border-bottom:1px solid #eee}@media(max-width:700px){.cards{grid-template-columns:1fr 1fr}}</style></head>
<body><header><h1>🌾 Agri Intelligence</h1><div>Cloud agriculture dashboard</div></header><main>
<div class="cards"><div class="c">Temperature<div class="n" id="t">—</div></div><div class="c">Rainfall<div class="n" id="r">—</div></div><div class="c">Satellite scenes<div class="n" id="s">—</div></div><div class="c">NDVI<div class="n">0.68</div></div></div>
<div class="c" style="margin-top:15px"><h2>Recent Sentinel-2 data</h2><table><thead><tr><th>Date</th><th>Cloud</th><th>Scene</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="c" style="margin-top:15px"><h2>Crop status</h2><p>🟢 Healthy — demo status.</p><p>Next production step: field polygon + actual Sentinel-2 bands → cloud mask → NDVI/NDWI/NDMI map.</p></div>
</main><script>
async function load(){try{let[w,s]=await Promise.all([fetch('/api/weather').then(x=>x.json()),fetch('/api/satellite').then(x=>x.json())]);let p=w.properties.parameter,d=Object.keys(p.T2M),last=d.at(-1);t.textContent=(p.T2M[last]||0).toFixed(1)+' °C';r.textContent=Object.values(p.PRECTOTCORR).reduce((a,b)=>a+(+b||0),0).toFixed(1)+' mm';document.getElementById('s').textContent=s.length;rows.innerHTML=s.map(x=>`<tr><td>${(x.date||'').slice(0,10)}</td><td>${x.cloud?.toFixed(1)??'—'}%</td><td>${x.id}</td></tr>`).join('')}catch(e){document.body.insertAdjacentHTML('beforeend','<p>Data service temporarily unavailable.</p>')}}load();
</script></body></html>
